services:
  - type: web
    name: pos-api
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install --include=dev && npx prisma generate && npx tsc
    startCommand: node dist/index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false  # Set manually in Render dashboard
      - key: JWT_SECRET
        value: pos_super_secret_key_2024
      - key: CORS_ORIGIN
        value: https://your-pos.netlify.app
      - key: PORT
        value: "3000"
