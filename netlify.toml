[build]
  base = "."
  command = "npm install && cd backend && npm install && npx prisma generate && cd ../frontend && npm install && npm run build"
  publish = "frontend/dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "18"
  PRISMA_CLI_BINARY_TARGETS = "rhel-openssl-3.0.x"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/api/:splat"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
